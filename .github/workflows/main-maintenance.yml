name: Main and Scheduled Maintenance

"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Yarn Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-yarn
      - name: Run audit
        run: yarn npm audit --all --recursive --environment production
        continue-on-error: true
      - name: Create issue on audit failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Security: yarn audit found high/critical vulnerabilities (${new Date().toISOString().slice(0, 10)})`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });
            const existing = issues.data.find(i => i.title === title);

            // Discover open Dependabot PRs that are likely related to dependency
            // vulnerabilities and link them as triage hints in the audit issue.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const relatedDependabotPrs = prs
              .filter(pr => pr.user?.login === 'dependabot[bot]')
              .filter(pr => {
                const labelNames = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name || '').toLowerCase());
                const title = (pr.title || '').toLowerCase();
                const hasDependencyLabel = labelNames.includes('dependencies') || labelNames.includes('security');
                const looksLikeBump = title.includes('bump');
                return hasDependencyLabel || looksLikeBump;
              })
              .slice(0, 10)
              .map(pr => `- #${pr.number} ${pr.title} (${pr.html_url})`);

            const baseBody = 'Weekly `yarn npm audit` found high or critical severity vulnerabilities. Run `yarn audit` locally for details.';
            const body = relatedDependabotPrs.length > 0
              ? `${baseBody}\n\nPotential related Dependabot PRs:\n${relatedDependabotPrs.join('\n')}`
              : `${baseBody}\n\nNo open Dependabot dependency/security PRs detected at issue creation time.`;

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['security', 'dependencies'],
                body
              });
            }

  neon-branches:
    # Previews broke silently for 3 days when the project hit its Neon branch
    # limit. Open an issue before that happens. Inert without NEON_PROJECT_ID.
    name: Neon branch count
    if: vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Count Neon branches
        id: count
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          count=$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY"                     "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches"                   | jq '.branches | length')
          echo "Neon branches: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Open an issue near the branch limit
        # Free plan limit is 10 branches per project — adjust if the plan changes.
        if: fromJSON(steps.count.outputs.count) >= 8
        uses: actions/github-script@v9
        env:
          COUNT: ${{ steps.count.outputs.count }}
        with:
          script: |
            const title = 'Neon: project is close to its branch limit';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The Neon project has ${process.env.COUNT} branches (limit: 10 on the free plan). ` +
                'At the limit every Vercel preview fails with "Resource provisioning failed". ' +
                'Delete orphaned `preview/*` branches in the Neon console.',
            });
